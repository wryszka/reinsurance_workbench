resources:
  pipelines:
    reinsurance_medallion:
      name: reinsurance_medallion
      serverless: true
      photon: true
      catalog: ${var.catalog}
      schema: ${var.schema}
      development: true
      configuration:
        source_catalog: ${var.catalog}
        source_schema: ${var.schema}
