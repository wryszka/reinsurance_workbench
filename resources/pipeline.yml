            path: ../notebooks/01_bronze_dlt_pipeline.py
        - notebook:
            path: ../notebooks/02_silver_dlt.py
        - notebook:
            path: ../notebooks/03_gold_dlt.py
      tags:
        project: reinsurance_workbench
