resources:
  jobs:
    reinsurance_00_setup:
      name: reinsurance_00_setup
      tags:
        project: reinsurance_workbench
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: seed
          default: "42"
      tasks:
        - task_key: data_gen
          notebook_task:
            notebook_path: ../notebooks/00_setup_and_data_generation.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              seed: "{{job.parameters.seed}}"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "5"
            dependencies: []
